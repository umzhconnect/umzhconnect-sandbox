arazzo: 1.0.1
info:
  title: Simple Referral Reception
  summary: >-
    Fulfiller-side workflow triggered when a placer creates a Task in the
    fulfiller FHIR store. Resolves the referenced ServiceRequest and its
    clinical graph from the placer's external API using a context-scoped
    access token, then imports the result into the fulfiller's local system.
  version: 0.2.0
  description: |
    The workflow is driven by three distinct API surfaces, each with its own
    base URL supplied as an input variable:

      keycloakUrl      — Authorization server (token endpoint)
      internalFhirUrl  — Fulfiller's own FHIR partition (workflow engine → HAPI)
      externalFhirUrl  — Placer's external FHIR gateway (cross-party reads)

    Base URLs are declared in `inputs` with sandbox defaults so the document
    can be executed as-is against a local stack. Override them for staging or
    production without touching the step logic.

    Security: private_key_jwt (L2) client authentication. The workflow engine
    is responsible for generating the RS256-signed client assertion before
    invoking the workflow (or as a pre-step not modelled here).

sourceDescriptions:
  # ── Auth server ──────────────────────────────────────────────────────────
  # Target URL at runtime: {inputs.keycloakUrl}/realms/umzh-connect/...
  - name: authServer
    url: ./keycloak-api.yaml
    type: openapi
    x-serverUrl: "{$inputs.keycloakUrl}"

  # ── Internal FHIR partition ───────────────────────────────────────────────
  # Target URL at runtime: {inputs.internalFhirUrl}/Task/{taskId}
  #                        {inputs.internalFhirUrl}/Bundle
  - name: internalFhir
    url: ./internal-fhir.yaml
    type: openapi
    x-serverUrl: "{$inputs.internalFhirUrl}"

  # ── Partner's external FHIR gateway ──────────────────────────────────────
  # Target URL at runtime: {inputs.externalFhirUrl}/fhir/ServiceRequest?_id=...
  - name: externalFhir
    url: ./umzh-connect-api.yaml
    type: openapi
    x-serverUrl: "{$inputs.externalFhirUrl}"

workflows:
  - workflowId: simpleReferralReception
    summary: Receive a referral Task, resolve placer data, and import locally.
    description: >-
      Reads the triggering Task, exchanges credentials for a context-scoped
      access token, fetches the referenced ServiceRequest with included
      resources from the placer's external gateway, converts to the local
      eToC FHIR profile, and posts to the local import API.
    inputs:
      type: object
      required: [taskId, clientAssertionJwt]
      properties:

        # ── Trigger ──────────────────────────────────────────────────────────
        taskId:
          type: string
          description: Logical id of the Task that triggered the workflow.
          example: TaskOrthopedicReferral

        # ── Base URLs ─────────────────────────────────────────────────────────
        keycloakUrl:
          type: string
          default: "http://localhost:8180"
          description: >-
            Keycloak authorization server base URL.
            Token endpoint: {keycloakUrl}/realms/umzh-connect/protocol/openid-connect/token
        internalFhirUrl:
          type: string
          default: "http://localhost:8090/fhir/fulfiller"
          description: >-
            Fulfiller's own FHIR partition (HAPI direct, no gateway auth).
            Task read:       {internalFhirUrl}/Task/{taskId}
            Bundle import:   {internalFhirUrl}/Bundle
        externalFhirUrl:
          type: string
          default: "http://localhost:8081"
          description: >-
            Placer's external FHIR gateway (OPA fhirContext-gated).
            ServiceRequest:  {externalFhirUrl}/fhir/ServiceRequest?_id=...&_include=...

        # ── Auth ──────────────────────────────────────────────────────────────
        clientId:
          type: string
          default: "fulfiller-client-l2"
          description: OAuth2 client_id for private_key_jwt authentication.
        clientAssertionJwt:
          type: string
          description: >-
            Pre-signed RS256 client assertion JWT.
            Claims: iss=sub=clientId, aud={keycloakUrl}/realms/umzh-connect/protocol/openid-connect/token,
            exp=now+60s, unique jti.
            Generated by the workflow engine from services/keys/fulfiller-l2.key.

    steps:

      # ────────────────────────────────────────────────────────────────────────
      # Step 1 — Read Task
      # URL: {$inputs.internalFhirUrl}/Task/{$inputs.taskId}
      # ────────────────────────────────────────────────────────────────────────
      - stepId: readTask
        description: >-
          Read Task/{$inputs.taskId} from {$inputs.internalFhirUrl}.
          Extracts Task.basedOn[0].reference — the placer ServiceRequest URL
          used as the fhirContext identifier in the next step.
        operationId: $sourceDescriptions.internalFhir.readLocalTask
        parameters:
          - name: id
            in: path
            value: $inputs.taskId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/resourceType == 'Task'
          - condition: $response.body#/basedOn != null
        outputs:
          serviceRequestRef: $response.body#/basedOn/0/reference

      # ────────────────────────────────────────────────────────────────────────
      # Step 2 — Get access token
      # URL: {$inputs.keycloakUrl}/realms/umzh-connect/protocol/openid-connect/token
      # ────────────────────────────────────────────────────────────────────────
      - stepId: getAccessToken
        description: >-
          POST {$inputs.keycloakUrl}/realms/umzh-connect/protocol/openid-connect/token.
          private_key_jwt client authentication (L2). authorization_details
          (RFC 9396) binds the ServiceRequest URL to the issued token as a
          fhirContext claim. OPA on the placer's gateway verifies that the
          caller's organization_reference appears as an actor on the Consent
          covering that ServiceRequest before permitting the cross-party read.
        operationId: $sourceDescriptions.authServer.getToken
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            grant_type:            client_credentials
            client_id:             $inputs.clientId
            client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            client_assertion:      $inputs.clientAssertionJwt
            authorization_details:
              $expression: >-
                '[{"type":"umzh-connect-context","identifier":"'
                + $steps.readTask.outputs.serviceRequestRef + '"}]'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/access_token != null
        outputs:
          accessToken: $response.body#/access_token

      # ────────────────────────────────────────────────────────────────────────
      # Step 3 — Fetch ServiceRequest from placer
      # URL: {$inputs.externalFhirUrl}/fhir/ServiceRequest?_id=...&_include=...
      # ────────────────────────────────────────────────────────────────────────
      - stepId: getServiceRequest
        description: >-
          GET {$inputs.externalFhirUrl}/fhir/ServiceRequest from the placer's
          external gateway. The fhirContext claim in the Bearer token gates
          the response to the consented ServiceRequest and its graph (Patient,
          Condition, Observation, etc.). _include materialises the graph in a
          single round-trip.
        operationId: $sourceDescriptions.externalFhir.searchServiceRequest
        parameters:
          - name: Authorization
            in: header
            value:
              $expression: "'Bearer ' + $steps.getAccessToken.outputs.accessToken"
          - name: _id
            in: query
            value: $steps.readTask.outputs.serviceRequestRef
          - name: _include
            in: query
            value: ServiceRequest:subject
          - name: _include
            in: query
            value: ServiceRequest:ch-umzhconnectig-servicerequest-supportinginfo
          - name: _include
            in: query
            value: ServiceRequest:ch-umzhconnectig-servicerequest-insurance
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/resourceType == 'Bundle'
        outputs:
          serviceRequestBundle: $response.body

      # ────────────────────────────────────────────────────────────────────────
      # Step 4 — Import into local system
      # URL: {$inputs.internalFhirUrl}/Bundle
      # ────────────────────────────────────────────────────────────────────────
      - stepId: importToLocalSystem
        description: >-
          POST {$inputs.internalFhirUrl}/Bundle.
          Converts the placer Bundle to the local eToC FHIR profile (transformation
          assumed performed by the workflow engine) and submits it to the
          fulfiller's internal import API.
        operationId: $sourceDescriptions.internalFhir.importBundle
        requestBody:
          contentType: application/fhir+json
          payload:
            $expression: $steps.getServiceRequest.outputs.serviceRequestBundle
        successCriteria:
          - condition: $statusCode >= 200
          - condition: $statusCode < 300
        outputs:
          importedLocation: $response.header.Location

    outputs:
      serviceRequestRef: $steps.readTask.outputs.serviceRequestRef
      importedLocation:  $steps.importToLocalSystem.outputs.importedLocation
