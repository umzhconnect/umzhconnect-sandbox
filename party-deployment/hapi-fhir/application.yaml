spring:
  main:
    # Required for HAPI FHIR v7.x — known circular dependency in SearchParamRegistry
    allow-circular-references: true
  datasource:
    # Managed (external) PostgreSQL. NO host or credentials are baked into this
    # file — every value is injected from the environment, so the SAME file works
    # in docker compose (values from .env) and in Kubernetes (values from the
    # managed-db-config ConfigMap; put the password in a Secret for a real DB).
    # See .env.example for the DB_* keys.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.format_sql: false
      hibernate.show_sql: false
      # A managed DB gives HAPI an empty schema; let Hibernate build/upgrade it.
      hibernate.hbm2ddl.auto: update
      hibernate.jdbc.batch_size: 20
      hibernate.cache.use_query_cache: false
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_structured_entries: false
      hibernate.cache.use_minimal_puts: false

hapi:
  fhir:
    fhir_version: R4
    # Built-in OpenAPI/Swagger UI at /fhir/swagger-ui/index.html + spec at
    # /fhir/api-docs. Served by HAPI's OpenApiInterceptor (its own static HTML,
    # NOT the response-highlighter), so it works independently of the browser
    # pretty-view. Off by default here because SPRING_CONFIG_LOCATION replaces
    # (not merges) the image's bundled config.
    openapi_enabled: true
    # Advertised base URL (CapabilityStatement.implementation.url + absolute
    # self-links / Location headers). From the environment, defaulting to the
    # sentinel the clinical-orders/registry proxies rewrite. Override
    # FHIR_SERVER_ADDRESS only when the base HAPI is exposed DIRECTLY (e.g. via
    # hapi-fhir-ingress), not when fronted by those proxies.
    server_address: ${FHIR_SERVER_ADDRESS:http://localhost:8090/fhir}
    # URL-based multi-tenancy: /fhir/{partitionName}/{resourceType}
    # Partitions ('clinical-orders', 'registry') are created after startup via
    # $partition-management-create-partition by the seed job.
    partitioning:
      multitenancy_enabled: true
      cross_partition_reference_mode: true
      partitioning_include_in_search_hashes: false
    # General settings
    allow_external_references: true
    allow_multiple_delete: true
    allow_placeholder_references: true
    auto_create_placeholder_reference_targets: true
    default_encoding: JSON
    default_pretty_print: true
    enable_index_missing_fields: false
    defer_indexing_for_codesystems_of_size: 0
    # Narrative generation
    narrative_enabled: false
    # CORS settings
    cors:
      allow_credentials: false
      allowed_origin:
        - '*'
    # Paging
    default_page_size: 20
    max_page_size: 200
    # Validation
    validation:
      requests_enabled: false
      responses_enabled: false
    # Bulk export
    bulk_export_enabled: false
    # Subscription
    subscription:
      resthook_enabled: false
      websocket_enabled: false
