# =============================================================================
# HAPI FHIR — partitioned instance backed by the managed Postgres.
# Its application.yaml is generated by kustomize from the SHARED
# ../../config/application.yaml (the same file docker compose mounts) — see
# kustomization.yaml `configMapGenerator: hapi-fhir-config`. DB connection values
# come from the managed-db-config ConfigMap, so one config works in both worlds.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  labels:
    app: hapi-fhir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hapi-fhir
  template:
    metadata:
      labels:
        app: hapi-fhir
    spec:
      # Satisfy the cluster's "restricted" Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hapi-fhir
          image: hapiproject/hapi:v7.4.0
          env:
            - name: SPRING_CONFIG_LOCATION
              value: file:///app/config/application.yaml
            # Base HAPI is exposed directly via hapi-fhir-ingress, so advertise
            # the external base. REMOVE this if you front it with the
            # clinical-orders/registry proxies (they need the localhost sentinel).
            - name: FHIR_SERVER_ADDRESS
              value: https://hapi-fhir.dev.umzhc.io.usz.ch/fhir
            # The image sets no -Xmx, so Java 17 defaults to MaxRAMPercentage=25%
            # (~256Mi at a 1Gi limit) — too little; rendering large responses (e.g.
            # the CapabilityStatement as HTML) OOMs. Give HAPI most of the limit.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          envFrom:
            - configMapRef:
                name: managed-db-config
            - secretRef:
                name: managed-db-secret
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /fhir/DEFAULT/metadata
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: hapi-fhir-config
---
apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir-service
  labels:
    app: hapi-fhir
spec:
  selector:
    app: hapi-fhir
  ports:
    - port: 8080
      targetPort: 8080
